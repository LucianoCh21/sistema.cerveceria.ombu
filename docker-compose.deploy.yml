# Override de despliegue (AE4). Se usa SIEMPRE junto al compose base:
#   docker compose -p ombu-deploy --env-file deploy/.env \
#     -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
# Lo más simple es usar deploy/levantar.sh, que arma este comando.
#
# Qué cambia respecto del compose base:
#  - Proyecto propio (ombu-deploy): volúmenes separados de los de desarrollo.
#  - Credenciales de SQL Server y RabbitMQ, tokens y DEMO_MODE vienen de deploy/.env.
#  - Los puertos internos se publican en 127.0.0.1 (ver deploy/.env), nunca en 0.0.0.0.
#  - Caddy es el único punto de entrada: sirve el cliente y hace proxy de /api,
#    así el navegador ve un solo origen (sin CORS) y las páginas estáticas piden basic_auth.
#  - El cliente recibe un config.js generado en el arranque con API_BASE relativo
#    y los tokens rotados (deploy/runtime/config.js, nunca se commitea).

name: ombu-deploy

services:
  sqlserver:
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      - MSSQL_MEMORY_LIMIT_MB=1536

  rabbitmq:
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Falta RABBITMQ_USER en deploy/.env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?Falta RABBITMQ_PASS en deploy/.env}
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    environment:
      - DB_PASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Falta ADMIN_TOKEN en deploy/.env}
      - TERMINAL_TOKEN=${TERMINAL_TOKEN:?Falta TERMINAL_TOKEN en deploy/.env}
      - DEMO_MODE=${DEMO_MODE:-true}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}

  worker:
    environment:
      - DB_PASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672

  client:
    volumes:
      - ./deploy/runtime/config.js:/usr/share/nginx/html/src/config.js:ro

  caddy:
    image: caddy:2-alpine
    container_name: ombu-caddy
    restart: always
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - ACME_EMAIL=${ACME_EMAIL:-sin-email@localhost}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:?Falta BASIC_AUTH_USER en deploy/.env}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:?levantar.sh calcula BASIC_AUTH_HASH}
    ports:
      - "${CADDY_HTTP_PORT:-127.0.0.1:8088}:80"
      - "${CADDY_HTTPS_PORT:-127.0.0.1:8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - api
    networks:
      - ombu-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  caddy_data:
  caddy_config:
