openapi: 3.0.3
info:
  title: API Tap Wall - Cervecería Ombú
  description: >
    Especificación OpenAPI 3.0 para el sistema de autoservicio de cerveza con tarjetas NFC (Tap Wall).
    Documenta el Módulo de Lecturas NFC, Despachos, Comprobantes Digitales y la integración con el Broker RabbitMQ
    conforme a las remediaciones ISO/IEC 25010 (F-02, F-03, F-04, F-06, F-07, F-20).
  version: 2.0.0
  contact:
    name: Lucrecia Sabrina Mencia & Luciano Rubén Chesani
    email: grupo1@ombu.cerveceria.com

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

security:
  - bearerAuth: []

tags:
  - name: NFC
    description: Autenticación de tarjetas, sesiones efímeras (TTL 45s en Redis) y formatos
  - name: Despachos
    description: Débito transaccional, cálculo oficial de precios y comprobantes en PDF
  - name: Eventos Asíncronos
    description: Publicación garantizada de eventos de dominio mediante Transactional Outbox

paths:
  /api/nfc/autenticar:
    post:
      tags:
        - NFC
      summary: Autenticar tarjeta física NFC e iniciar sesión efímera en Redis (TTL 45s)
      description: >
        Invocado cuando un cliente aproxima su tarjeta NFC al lector de una canilla.
        Verifica en SQL Server que la tarjeta exista, esté activa y tenga saldo positivo.
        Crea una sesión efímera en Redis (TTL 45 segundos) asociada a la canilla.
      operationId: autenticarTarjetaNFC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutenticarNFCRequest'
      responses:
        '200':
          description: Tarjeta autorizada y grifo habilitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutenticarNFCResponse'
        '400':
          description: Faltan parámetros requeridos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Saldo insuficiente para iniciar consumo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tarjeta inhabilitada o bloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarjeta no registrada en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Redis no disponible para guardar la sesión efímera (F-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno sanitizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/sesion/{uid}:
    get:
      tags:
        - NFC
      summary: Consultar estado de sesión efímera de una tarjeta en Redis
      operationId: consultarSesionNFC
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          description: Identificador / UID de la tarjeta NFC
          schema:
            type: string
      responses:
        '200':
          description: Sesión activa y vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  activa:
                    type: boolean
                    example: true
                  sesion:
                    type: object
        '404':
          description: Sesión no encontrada o expirada (TTL agotado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/tarjetas:
    get:
      tags:
        - NFC
      summary: Listar tarjetas NFC registradas (Solo Admin o Demo Mode)
      operationId: listarTarjetas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de tarjetas con estado y titular
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TarjetaItem'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Requiere rol admin (cuando DEMO_MODE=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/formatos:
    get:
      tags:
        - NFC
      summary: Obtener formatos de servicio y precios vigentes para una canilla
      operationId: obtenerFormatosYPrecios
      security:
        - bearerAuth: []
      parameters:
        - name: id_canilla
          in: query
          required: false
          description: ID de la canilla para filtrar precios de la cerveza conectada
          schema:
            type: integer
      responses:
        '200':
          description: Formatos con precios vigentes en SQL Server (F-02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatosResponse'

  /api/despachos:
    post:
      tags:
        - Despachos
      summary: Registrar despacho, débito atómico y encolar evento en Outbox (F-02, F-03, F-07)
      description: >
        Procesa el servido final del cliente.
        Valida que la sesión en Redis coincida con la canilla servida (F-03).
        Calcula el precio y volumen en base de datos sin confiar en valores del cliente (F-02).
        Debita saldo, actualiza stock y registra el evento en EventoOutbox atómicamente (F-07).
      operationId: crearDespacho
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Clave de idempotencia para prevenir dobles cobros accidentales
          schema:
            type: string
            example: idem-tap-1727123456-abc1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespachoRequest'
      responses:
        '201':
          description: Despacho completado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DespachoResponse'
        '200':
          description: Petición repetida resuelta por Idempotencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DespachoResponse'
        '400':
          description: Faltan parámetros o formato no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Saldo insuficiente al debitar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sesión expirada (TTL) o canilla discrepante (SESSION_TAP_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Barril inactivo, stock insuficiente o precio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error transaccional con traceId seguro (F-06)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/despachos/{id}/comprobante:
    get:
      tags:
        - Despachos
      summary: Generar y descargar ticket comprobante en formato PDF
      operationId: obtenerComprobantePDF
      parameters:
        - name: id
          in: path
          required: true
          description: ID del despacho
          schema:
            type: integer
      responses:
        '200':
          description: Documento binario PDF generado al vuelo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Despacho no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Tokens por rol preconfigurados (TERMINAL_TOKEN o ADMIN_TOKEN)

  schemas:
    AutenticarNFCRequest:
      type: object
      required:
        - id_tarjeta
        - id_canilla
      properties:
        id_tarjeta:
          type: string
          example: "A1B2C3D4E5"
        id_canilla:
          type: integer
          example: 1

    AutenticarNFCResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        sesionValida:
          type: boolean
          example: true
        id_tarjeta:
          type: string
          example: "A1B2C3D4E5"
        cliente_nombre:
          type: string
          example: "Juan Pérez"
        saldo_disponible:
          type: number
          example: 4500.00
        id_canilla:
          type: integer
          example: 1
        ttl_segundos:
          type: integer
          example: 45

    DespachoRequest:
      type: object
      required:
        - id_tarjeta
        - id_canilla
        - id_formato
      properties:
        id_tarjeta:
          type: string
          example: "A1B2C3D4E5"
        id_canilla:
          type: integer
          example: 1
        id_formato:
          type: integer
          description: ID oficial de FormatoServicio en OmbuDB (F-02)
          example: 2

    DespachoResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        id_despacho:
          type: integer
          example: 120
        id_canilla:
          type: integer
          example: 1
        id_barril:
          type: integer
          example: 3
        cerveza:
          type: string
          example: "IPA Pampeana"
        formato:
          type: string
          example: "Pinta"
        volumen_litros:
          type: number
          example: 0.500
        importe_cobrado:
          type: number
          example: 3500.00
        saldo_restante:
          type: number
          example: 1000.00
        comprobante_url:
          type: string
          example: "/api/despachos/120/comprobante"
        evento_outbox_registrado:
          type: boolean
          example: true
        fecha_hora:
          type: string
          format: date-time

    FormatosResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        id_canilla:
          type: integer
          example: 1
        cerveza:
          type: string
          example: "Golden Ale"
        formatos:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 2
              nombre:
                type: string
                example: "Pinta"
              ml:
                type: integer
                example: 500
              precio:
                type: number
                example: 3500.00
              icon:
                type: string
                example: "🍺"

    TarjetaItem:
      type: object
      properties:
        uid:
          type: string
          example: "A1B2C3D4E5"
        saldo:
          type: number
          example: 2500.00
        estado:
          type: string
          example: "Activa"
        titular:
          type: string
          example: "Lucía Méndez"
        tipo:
          type: string
          example: "Nominada"

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: "Acceso no autorizado."
        codigo:
          type: string
          example: "UNAUTHORIZED"
        traceId:
          type: string
          example: "k8x1a9b2"
          description: Identificador único de log para seguimiento interno (F-06)

    DespachoRealizadoEvent:
      type: object
      description: Mensaje publicado en RabbitMQ (Exchange 'ombu.eventos', Routing Key 'despacho.confirmado') vía Outbox
      properties:
        eventId:
          type: string
          example: "evt-1728760000-120"
        eventType:
          type: string
          example: "DespachoRealizado"
        occurredAt:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0"
        idempotencyKey:
          type: string
          example: "idem-tap-1728760000-abc1234"
        producer:
          type: string
          example: "modulo-nfc-despachos"
        data:
          type: object
          properties:
            idDespacho:
              type: integer
              example: 120
            idCanilla:
              type: integer
              example: 1
            idBarril:
              type: integer
              example: 3
            idFormato:
              type: integer
              example: 2
            volumenLitros:
              type: number
              example: 0.500
            mililitros:
              type: integer
              example: 500
            formato:
              type: string
              example: "Pinta"
            importeDebitado:
              type: number
              example: 3500.00
            idTarjeta:
              type: string
              example: "A1B2C3D4E5"
            idCliente:
              type: integer
              nullable: true
              example: 4
