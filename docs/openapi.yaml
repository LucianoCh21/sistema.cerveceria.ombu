openapi: 3.0.3
info:
  title: API Tap Wall - Cervecería Ombú
  description: >
    Especificación OpenAPI 3.0 para el sistema de autoservicio de cerveza con tarjetas NFC (Tap Wall).
    Documenta el Módulo de Lecturas NFC, Despachos, Comprobantes Digitales, Canillas, Barriles,
    Control de Stock, Salud del Sistema y la integración asíncrona con el Broker RabbitMQ
    conforme a los lineamientos de calidad de la norma ISO/IEC 25010 (F-01 a F-21).
  version: 2.1.0
  contact:
    name: Lucrecia Sabrina Mencia & Luciano Rubén Chesani
    email: grupo1@ombu.cerveceria.com

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

security:
  - bearerAuth: []

tags:
  - name: NFC
    description: Autenticación de tarjetas, sesiones efímeras (TTL 45s en Redis) y formatos
  - name: Despachos
    description: Débito transaccional, cálculo oficial de precios y comprobantes en PDF
  - name: Canillas
    description: Gestión física, alta y consulta del muro de canillas (Tap Wall)
  - name: Barriles
    description: Asignación, conexión atómica concurrente y retiro de barriles
  - name: Stock
    description: Monitoreo en tiempo real de niveles de inventario y remanentes
  - name: Infraestructura
    description: Diagnóstico de salud y resiliencia de servicios dependientes (F-09)
  - name: Eventos Asíncronos
    description: Publicación garantizada de eventos de dominio mediante Transactional Outbox

paths:
  /api/health:
    get:
      tags:
        - Infraestructura
      summary: Chequeo de salud del sistema y dependencias (F-09)
      description: >
        Realiza pings activos hacia SQL Server (SELECT 1), Redis (PING) y RabbitMQ (AMQP connection).
        Si los tres responden adecuadamente, retorna HTTP 200 con estado 'ok'.
        Si alguno de los servicios falla o agota el tiempo de espera, retorna HTTP 503 con estado 'caido'.
      operationId: checkHealth
      responses:
        '200':
          description: Todos los servicios e infraestructura se encuentran operativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Uno o más servicios esenciales se encuentran caídos o inaccesibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/canillas:
    get:
      tags:
        - Canillas
      summary: Listar todas las canillas físicas y barril conectado
      description: >
        Retorna la lista de canillas físicas ordenadas por número, junto con los datos
        del barril conectado actualmente, variedad y estilo de cerveza.
      operationId: getCanillas
      responses:
        '200':
          description: Lista de canillas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanillaItem'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Canillas
      summary: Registrar una nueva canilla física
      description: >
        Da de alta un grifo físico en el sistema. Requiere token con rol administrativo.
      operationId: createCanilla
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanillaCreateRequest'
      responses:
        '201':
          description: Canilla registrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Canilla creada exitosamente"
        '400':
          description: Faltan campos obligatorios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Requiere rol administrativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/canillas/{id}:
    get:
      tags:
        - Canillas
      summary: Consultar una canilla por su ID
      operationId: getCanillaById
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la canilla
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la canilla
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanillaItem'
        '404':
          description: Canilla no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Canillas
      summary: Actualizar estado o número de una canilla
      operationId: updateCanilla
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la canilla
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanillaCreateRequest'
      responses:
        '200':
          description: Canilla modificada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Canilla actualizada exitosamente"
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Canilla no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Canillas
      summary: Baja lógica de canilla (desactivación)
      operationId: deleteCanilla
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la canilla a dar de baja
          schema:
            type: integer
      responses:
        '200':
          description: Canilla pasada a estado Inactiva
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Canilla pasada a estado Inactiva exitosamente"
        '404':
          description: Canilla no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/barriles:
    get:
      tags:
        - Barriles
      summary: Listar todos los barriles activos (no retirados)
      description: >
        Consulta el stock de barriles con estado distinto de 'Retirado'.
        Requiere rol administrativo (admin).
      operationId: getBarriles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de barriles disponibles o conectados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BarrilItem'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Requiere rol administrativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/barriles/conectar:
    post:
      tags:
        - Barriles
      summary: Conectar un barril a una canilla física (Transacción SERIALIZABLE)
      description: >
        Aplica un bloqueo estricto con nivel SERIALIZABLE y WITH (UPDLOCK, HOLDLOCK)
        para impedir que dos operadores asignen barriles concurrentemente sobre la misma canilla (RN-03).
        Asigna fecha de conexión y el ID del empleado autenticado que ejecutó la maniobra.
      operationId: conectarBarril
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConectarBarrilRequest'
      responses:
        '200':
          description: Barril conectado exitosamente a la canilla
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Barril conectado exitosamente."
        '400':
          description: Parámetros faltantes o la canilla ya posee un barril conectado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Barril no encontrado o se encuentra en estado Retirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/barriles/{id}:
    delete:
      tags:
        - Barriles
      summary: Desconectar y retirar un barril (Baja lógica / Soft Delete)
      description: >
        Actualiza el estado del barril a 'Retirado', desvincula la canilla (id_canilla = NULL)
        y registra la fecha y hora de desconexión sin destruir el historial contable.
      operationId: retirarBarril
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del barril a retirar
          schema:
            type: integer
      responses:
        '204':
          description: Barril retirado exitosamente (sin contenido)
        '400':
          description: El barril ya se encuentra en estado Retirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Barril no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/stock/resumen:
    get:
      tags:
        - Stock
      summary: Obtener resumen del stock de barriles con caché Redis y fallback SQL
      description: >
        Provee el estado de volumen y porcentaje de llenado de cada canilla.
        Lee desde la clave en memoria Redis 'stock:muro:resumen' (TTL 60s). Si la caché
        no responde, degrada controladamente consultando SQL Server y regenerando la clave (RNF-14).
      operationId: getStockResumen
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen de inventario obtenido con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResumenResponse'
        '500':
          description: Error crítico al consultar base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/autenticar:
    post:
      tags:
        - NFC
      summary: Autenticar tarjeta física NFC e iniciar sesión efímera en Redis (TTL 45s)
      description: >
        Invocado cuando un cliente aproxima su tarjeta NFC al lector de una canilla.
        Verifica en SQL Server que la tarjeta exista, esté activa y tenga saldo positivo.
        Crea una sesión efímera en Redis (TTL 45 segundos) asociada a la canilla.
      operationId: autenticarTarjetaNFC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutenticarNFCRequest'
      responses:
        '200':
          description: Tarjeta autorizada y grifo habilitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutenticarNFCResponse'
        '400':
          description: Faltan parámetros requeridos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Saldo insuficiente para iniciar consumo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tarjeta inhabilitada o bloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarjeta no registrada en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Redis no disponible para guardar la sesión efímera (F-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno sanitizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/sesion/{uid}:
    get:
      tags:
        - NFC
      summary: Consultar estado de sesión efímera de una tarjeta en Redis
      operationId: consultarSesionNFC
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          description: Identificador / UID de la tarjeta NFC
          schema:
            type: string
      responses:
        '200':
          description: Sesión activa y vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  activa:
                    type: boolean
                    example: true
                  sesion:
                    type: object
        '404':
          description: Sesión no encontrada o expirada (TTL agotado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/tarjetas:
    get:
      tags:
        - NFC
      summary: Listar tarjetas NFC registradas (Solo Admin o Demo Mode)
      operationId: listarTarjetas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de tarjetas con estado y titular
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TarjetaItem'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Requiere rol admin (cuando DEMO_MODE=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/nfc/formatos:
    get:
      tags:
        - NFC
      summary: Obtener formatos de servicio y precios vigentes para una canilla
      operationId: obtenerFormatosYPrecios
      security:
        - bearerAuth: []
      parameters:
        - name: id_canilla
          in: query
          required: false
          description: ID de la canilla para filtrar precios de la cerveza conectada
          schema:
            type: integer
      responses:
        '200':
          description: Formatos con precios vigentes en SQL Server (F-02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatosResponse'

  /api/despachos:
    post:
      tags:
        - Despachos
      summary: Registrar despacho, débito atómico y encolar evento en Outbox (F-02, F-03, F-07)
      description: >
        Procesa el servido final del cliente.
        Valida que la sesión en Redis coincida con la canilla servida (F-03).
        Calcula el precio y volumen en base de datos sin confiar en valores del cliente (F-02).
        Debita saldo, actualiza stock y registra el evento en EventoOutbox atómicamente (F-07).
      operationId: crearDespacho
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Clave de idempotencia para prevenir dobles cobros accidentales
          schema:
            type: string
            example: idem-tap-1727123456-abc1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespachoRequest'
      responses:
        '201':
          description: Despacho completado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DespachoResponse'
        '200':
          description: Petición repetida resuelta por Idempotencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DespachoResponse'
        '400':
          description: Faltan parámetros o formato no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Saldo insuficiente al debitar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sesión expirada (TTL) o canilla discrepante (SESSION_TAP_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Barril inactivo, stock insuficiente o precio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error transaccional con traceId seguro (F-06)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/despachos/{id}/comprobante:
    get:
      tags:
        - Despachos
      summary: Generar y descargar ticket comprobante en formato PDF
      operationId: obtenerComprobantePDF
      parameters:
        - name: id
          in: path
          required: true
          description: ID del despacho
          schema:
            type: integer
      responses:
        '200':
          description: Documento binario PDF generado al vuelo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Despacho no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Tokens por rol preconfigurados (TERMINAL_TOKEN o ADMIN_TOKEN)

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        servicios:
          type: object
          properties:
            sqlserver:
              type: string
              example: "ok"
            redis:
              type: string
              example: "ok"
            rabbitmq:
              type: string
              example: "ok"

    CanillaItem:
      type: object
      properties:
        id_canilla:
          type: integer
          example: 1
        numero:
          type: integer
          example: 1
        estado:
          type: string
          example: "Activa"
        fecha_alta:
          type: string
          format: date
        id_barril:
          type: integer
          nullable: true
          example: 1
        litros_restantes:
          type: number
          nullable: true
          example: 48.50
        litros_totales:
          type: number
          nullable: true
          example: 50.00
        estado_barril:
          type: string
          nullable: true
          example: "Conectado"
        id_cerveza:
          type: integer
          nullable: true
          example: 2
        estilo:
          type: string
          nullable: true
          example: "IPA Pampeana"
        variedad:
          type: string
          nullable: true
          example: "Session"
        ibu:
          type: integer
          nullable: true
          example: 45
        abv:
          type: number
          nullable: true
          example: 5.4

    CanillaCreateRequest:
      type: object
      required:
        - numero
        - estado
      properties:
        numero:
          type: integer
          example: 5
        estado:
          type: string
          enum: [Activa, Mantenimiento, Inactiva]
          example: "Activa"

    BarrilItem:
      type: object
      properties:
        id_barril:
          type: integer
          example: 8
        id_cerveza:
          type: integer
          example: 1
        id_canilla:
          type: integer
          nullable: true
          example: 2
        id_empleado_conexion:
          type: integer
          example: 1
        litros_totales:
          type: number
          example: 50.00
        litros_restantes:
          type: number
          example: 50.00
        fecha_conexion:
          type: string
          format: date-time
        fecha_desconexion:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          enum: [Conectado, Agotado, Retirado]
          example: "Conectado"

    ConectarBarrilRequest:
      type: object
      required:
        - id_barril
        - id_canilla
        - id_empleado_conexion
      properties:
        id_barril:
          type: integer
          example: 8
        id_canilla:
          type: integer
          example: 2
        id_empleado_conexion:
          type: integer
          description: ID del empleado responsable de la conexión (F-14)
          example: 1

    StockResumenResponse:
      type: object
      properties:
        origen:
          type: string
          enum: [redis-cache, sql-server]
          example: "redis-cache"
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockCanillaItem'

    StockCanillaItem:
      type: object
      properties:
        id_canilla:
          type: integer
          example: 1
        numero_canilla:
          type: integer
          example: 1
        estado_canilla:
          type: string
          example: "Activa"
        id_barril:
          type: integer
          nullable: true
          example: 2
        litros_totales:
          type: number
          nullable: true
          example: 50.00
        litros_restantes:
          type: number
          nullable: true
          example: 45.50
        estado_barril:
          type: string
          nullable: true
          example: "Conectado"
        nombre_cerveza:
          type: string
          nullable: true
          example: "Golden Ale"

    AutenticarNFCRequest:
      type: object
      required:
        - id_tarjeta
        - id_canilla
      properties:
        id_tarjeta:
          type: string
          example: "A1B2C3D4E5"
        id_canilla:
          type: integer
          example: 1

    AutenticarNFCResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        sesionValida:
          type: boolean
          example: true
        id_tarjeta:
          type: string
          example: "A1B2C3D4E5"
        cliente_nombre:
          type: string
          example: "Juan Pérez"
        saldo_disponible:
          type: number
          example: 4500.00
        id_canilla:
          type: integer
          example: 1
        ttl_segundos:
          type: integer
          example: 45

    DespachoRequest:
      type: object
      required:
        - id_tarjeta
        - id_canilla
        - id_formato
      properties:
        id_tarjeta:
          type: string
          example: "A1B2C3D4E5"
        id_canilla:
          type: integer
          example: 1
        id_formato:
          type: integer
          description: ID oficial de FormatoServicio en OmbuDB (F-02)
          example: 2

    DespachoResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        id_despacho:
          type: integer
          example: 120
        id_canilla:
          type: integer
          example: 1
        id_barril:
          type: integer
          example: 3
        cerveza:
          type: string
          example: "IPA Pampeana"
        formato:
          type: string
          example: "Pinta"
        volumen_litros:
          type: number
          example: 0.500
        importe_cobrado:
          type: number
          example: 3500.00
        saldo_restante:
          type: number
          example: 1000.00
        comprobante_url:
          type: string
